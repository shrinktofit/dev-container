appId: com.bluesquall.dev-container
productName: Dev Container
electronVersion: 42.6.0
asar: true
npmRebuild: false

directories:
  output: ../dist
  buildResources: build-resources

files:
  - from: .
    filter:
      - lib/**/*
      - build-resources/**/*
      - node_modules/**/*
      - package.json

win:
  executableName: dev-container
  icon: build-resources/dev-container-icon.ico
  target:
    - target: zip
      arch:
        - x64
